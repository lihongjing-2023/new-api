# CNB 云原生开发环境初始化配置
#
# 触发方式：仓库页面点击「云原生构建 / 云端开发」启动开发环境。
# 初始化流程：
#   1. 用 .ide/Dockerfile 动态构建开发镜像（基于 CNB 默认模板容器
#      cnbcool/default-dev-env 扩展，内置 code-server WebIDE / VSCode server，
#      并补充安装 Go 1.26.1 / Bun / make；构建失败时回退到默认模板镜像）
#   2. 进入 IDE 前校验工具链版本
#   3. 进入 IDE 后自动安装后端 Go 模块依赖与前端 Bun 依赖，实现开箱即用

$:
  vscode:
    - runner:
        cpus: 8
      docker:
        # 自定义开发环境镜像；image 作为 build 失败时的回退镜像
        build: .ide/Dockerfile
        image: cnbcool/default-dev-env:latest
      services:
        - vscode
        - docker
      stages:
        # 进入开发环境前：快速校验工具链（此阶段失败会销毁环境，便于尽早暴露配置问题）
        - name: 校验开发工具链
          script: |
            set -e
            echo "==> go:   $(go version)"
            echo "==> bun:  $(bun --version)"
            echo "==> git:  $(git --version)"
            echo "==> make: $(make --version | head -n 1)"
            echo "==> node: $(node --version)"

        # 进入点：该任务执行完成后才开放 IDE 入口
        - name: vscode go
          type: vscode:go

        # 进入 IDE 后（后台执行，失败不会销毁环境，可重新运行）：
        # 安装后端 Go 模块依赖（根模块 + relaykit 独立模块，构建需 GOWORK=off）
        - name: 安装后端 Go 模块依赖
          script: |
            set -e
            echo "==> 下载根模块依赖..."
            GOWORK=off go mod download
            echo "==> 下载 relaykit 模块依赖..."
            cd relaykit && GOWORK=off go mod download

        # 进入 IDE 后：安装前端 Bun 依赖（锁定 web/bun.lock）
        - name: 安装前端 Bun 依赖
          script: |
            set -e
            cd web
            bun install --frozen-lockfile
